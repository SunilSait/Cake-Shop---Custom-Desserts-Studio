<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A new seasonal confectionery collection is in creation. Subscribe for private release access from Dessert Cake Studio.">
    <title>Seasonal Collection Coming Soon | Dessert Cake Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="coming-soon-page">
    <!-- Toggles -->
    <div class="error-toggles">
        <button onclick="toggleDir()" class="nav-icon-btn" title="Toggle Direction"><span class="dir-label" style="font-size:0.65rem;font-weight:700;">LTR</span></button>
        <button onclick="toggleTheme()" class="nav-icon-btn" title="Toggle Theme"><span class="theme-icon-wrap"></span></button>
    </div>

    <div class="coming-soon-content">
        <!-- Logo -->
        <a href="index.html" class="coming-soon-logo" aria-label="Back to home">
            <div class="nav-logo-icon">
                <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="22" y="58" width="56" height="22" rx="6" fill="#C47C48"/>
                    <rect x="25" y="60" width="50" height="3" rx="1.5" fill="#FAF7F2" opacity="0.6"/>
                    <rect x="30" y="40" width="40" height="20" rx="5" fill="#FAF7F2"/>
                    <rect x="33" y="42" width="34" height="2.5" rx="1.2" fill="#C47C48" opacity="0.5"/>
                    <rect x="37" y="26" width="26" height="16" rx="4" fill="#C47C48"/>
                    <circle cx="50" cy="20" r="5" fill="#FAF7F2"/>
                    <path d="M50 11C48.5 14 47 16 50 19C53 16 51.5 14 50 11Z" fill="#E5A862"/>
                </svg>
            </div>
            <div class="nav-logo-text"><span class="brand-top">DESSERT</span><span class="brand-bottom">Cake Studio</span></div>
        </a>

        <div class="coming-soon-icon">
            <i class="fa-solid fa-wand-magic-sparkles" style="font-size:40px;color:var(--primary);"></i>
        </div>

        <h1>A New Collection is Rising</h1>
        <p>Our pastry artists are developing an exclusive seasonal confectionery series. Subscribe to receive private release invitations and early ordering access.</p>

        <!-- Live Launch Countdown Timer -->
        <div class="coming-soon-countdown">
            <div class="countdown-unit">
                <span class="countdown-num" id="cd-days">18</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-sep">:</div>
            <div class="countdown-unit">
                <span class="countdown-num" id="cd-hours">09</span>
                <span class="countdown-label">Hours</span>
            </div>
            <div class="countdown-sep">:</div>
            <div class="countdown-unit">
                <span class="countdown-num" id="cd-minutes">45</span>
                <span class="countdown-label">Mins</span>
            </div>
            <div class="countdown-sep">:</div>
            <div class="countdown-unit">
                <span class="countdown-num" id="cd-seconds">30</span>
                <span class="countdown-label">Secs</span>
            </div>
        </div>

        <form class="newsletter-form" onsubmit="event.preventDefault(); alert('You have been added to our private release list!');" style="max-width:440px;margin:0 auto;">
            <input type="email" placeholder="Enter your email address" required>
            <button type="submit" class="btn btn-primary">Notify Me</button>
        </form>

        <div style="margin-top:2.75rem;">
            <a href="index.html" class="btn btn-ghost">
                <i class="fa-solid fa-house" style="font-size:15px;margin-right:4px;"></i>
                Return to Home
            </a>
        </div>
    </div>
</div>

<script src="components.js"></script>
<script>
initAuthPage();

// Countdown Timer logic
(function() {
    const launchDate = new Date();
    launchDate.setDate(launchDate.getDate() + 18);
    launchDate.setHours(launchDate.getHours() + 9);
    launchDate.setMinutes(launchDate.getMinutes() + 45);

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = launchDate.getTime() - now;
        if (distance < 0) return;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        const elDays = document.getElementById('cd-days');
        const elHours = document.getElementById('cd-hours');
        const elMins = document.getElementById('cd-minutes');
        const elSecs = document.getElementById('cd-seconds');

        if (elDays) elDays.textContent = String(days).padStart(2, '0');
        if (elHours) elHours.textContent = String(hours).padStart(2, '0');
        if (elMins) elMins.textContent = String(minutes).padStart(2, '0');
        if (elSecs) elSecs.textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
})();
</script>
</body>
</html>
