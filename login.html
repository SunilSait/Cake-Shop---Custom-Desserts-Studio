<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Dessert Cake Studio client portal to track commissions, manage delivery dates, and view past orders.">
    <title>Client Sign In | Dessert Cake Studio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="auth-card">
        <!-- Theme & RTL Toggles -->
        <div class="auth-toggles">
            <button onclick="toggleDir()" class="nav-icon-btn" title="Toggle Direction"><span class="dir-label" style="font-size:0.65rem;font-weight:700;">LTR</span></button>
            <button onclick="toggleTheme()" class="nav-icon-btn" title="Toggle Theme"><span class="theme-icon-wrap"></span></button>
        </div>

        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="Back to home">
            <div class="nav-logo-icon">
                <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="22" y="58" width="56" height="22" rx="6" fill="#C47C48"/>
                    <rect x="25" y="60" width="50" height="3" rx="1.5" fill="#FAF7F2" opacity="0.6"/>
                    <rect x="30" y="40" width="40" height="20" rx="5" fill="#FAF7F2"/>
                    <rect x="33" y="42" width="34" height="2.5" rx="1.2" fill="#C47C48" opacity="0.5"/>
                    <rect x="37" y="26" width="26" height="16" rx="4" fill="#C47C48"/>
                    <circle cx="50" cy="20" r="5" fill="#FAF7F2"/>
                </svg>
            </div>
            <div class="nav-logo-text"><span class="brand-top">DESSERT</span><span class="brand-bottom">Cake Studio</span></div>
        </a>

        <h1>Client Portal Sign In</h1>
        <p class="auth-subtitle">Access your bespoke commission briefs, tasting notes, and delivery schedules.</p>

        <form onsubmit="event.preventDefault(); alert('Signed in successfully!'); window.location.href='index.html';">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="client@domain.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <div class="password-field">
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                    <button type="button" class="pw-toggle" onclick="togglePasswordVisibility('login-password', this)" aria-label="Toggle password visibility"><span class="pw-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                </div>
            </div>
            <div class="form-row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
                <label class="checkbox-wrap"><input type="checkbox"><span>Remember session</span></label>
                <a href="#" class="form-link">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-full">Sign In to Portal</button>
        </form>

        <div class="auth-divider"><span>or continue with</span></div>

        <button class="social-btn" onclick="alert('Google Sign In')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.053 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
            Continue with Google
        </button>
        <button class="social-btn" onclick="alert('Apple Sign In')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            Continue with Apple
        </button>

        <p class="auth-footer">New to Dessert Cake Studio? <a href="signup.html">Create an Account</a></p>
    </div>
</div>

<script src="components.js"></script>
<script>initAuthPage();</script>
</body>
</html>
